# cyberspice now-playing titles — tmux settings.
#
# Load from ~/.tmux.conf (or run once with `tmux source-file <path>`):
#   source-file /path/to/cyberspice/contrib/tmux/cyberspice.conf
#
# `multiplexer` mode (window name) needs nothing: the status bar shows window
# names by default, and cyberspice restores the name and automatic-rename
# when it exits.

# `pane` mode sets #{pane_title}, which tmux only draws on pane borders.
# The default pane-border-format already includes "#{pane_title}".
set -g pane-border-status top

# `xterm` mode emits OSC 2, which tmux stores as the pane title
# (allow-set-title, on by default). Forward the active pane's title to the
# outer terminal's window title:
set -g allow-set-title on
set -g set-titles on
set -g set-titles-string "#T"
